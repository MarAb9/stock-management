services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stock
      POSTGRES_USER: stock
      POSTGRES_PASSWORD: stock
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  backend:
    build: ./backend
    working_dir: /app
    volumes:
      - ./backend:/app
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: stock
      DB_USERNAME: stock
      DB_PASSWORD: stock
    ports:
      - "8000:8000"
    depends_on:
      - database
    command: php artisan serve --host=0.0.0.0 --port=8000
volumes:
  postgres_data:
